name: keep-alive

on:
  schedule:
    - cron: "17 */4 * * *"   # 4時間ごと (スリープ防止)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visit app (wake if sleeping)
        run: python etl/keep_alive.py https://jal-lsp.streamlit.app/
