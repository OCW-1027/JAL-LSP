name: update-timetable

on:
  schedule:
    - cron: "0 18 * * 0"      # 毎週月曜 03:00 JST
  workflow_dispatch:
    inputs:
      days:
        description: "取得日数"
        default: "150"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch JAL timetable from ekitan
        run: python etl/fetch_ekitan.py --days ${{ github.event.inputs.days || 150 }} --workers 4 --delay 1.0
      - name: Commit data
        run: |
          git config user.name "timetable-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/flights_by_date.csv data/meta.json
          git diff --cached --quiet && echo "no change" || git commit -m "data: timetable $(date -u +%F)"
          git push
